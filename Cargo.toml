[package]
name = "bolt-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
env_logger = "0.11.12"
gpui = "0.2.2"
gpui-component = "0.10.0"
gpui-webview = "0.10.0"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "cookies", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
thiserror = "2.0.21"
url = "2.5.9"
